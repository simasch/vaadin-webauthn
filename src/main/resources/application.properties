spring.application.name=vaadin-webauthn
server.port=8080

# WebAuthn relying party. The rp-id must be the domain the browser sees (no scheme, no port),
# and the allowed origins must match the URL in the address bar exactly.
webauthn.rp-id=localhost
webauthn.rp-name=Vaadin WebAuthn Demo
webauthn.allowed-origins=http://localhost:8080

vaadin.launch-browser=true
